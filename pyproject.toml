[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-bridge"
version = "0.1.0"
description = "Local AI task bridge for Gemini Deep Research and Gemini App Tasks via Browser Session or Interactions API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Gemini Bridge Contributors"}
]
dependencies = [
    "click>=8.1.0",
    "PyYAML>=6.0",
    "httpx>=0.23.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
    "selenium>=4.8.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
gemini-bridge = "gemini_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
