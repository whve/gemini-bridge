# Gemini Bridge Configuration Example
# Copy to config.yaml or ~/.config/gemini-bridge/config.yaml

# Default execution backend:
# - "web": Reuse existing Gemini web account via Playwright (CDP attach or dedicated profile)
# - "api": Optional official Gemini Interactions API (only enabled when api_key is configured)
default_backend: "web"

# Storage paths (relative to project root or absolute paths)
data_dir: "./data"
results_dir: "./results"
db_path: "./data/tasks.db"
logs_dir: "./data/logs"

# Browser Backend Configuration (Priority 1: Reuse existing Gemini Web Account)
browser:
  # Engine preference: "playwright" (recommended on macOS) or "selenium" (fallback)
  engine: "playwright"
  # Connection mode:
  # - "cdp": Connect to an already-running Chrome/Brave/Arc instance with --remote-debugging-port
  # - "persistent_profile": Launch dedicated browser context in user_data_dir (login once manually, reused thereafter)
  mode: "cdp"
  cdp_url: "http://127.0.0.1:9222"
  # Dedicated persistent browser profile directory (NEVER touches your default Chrome profile or cookies without confirmation)
  user_data_dir: "~/.gemini-bridge/chrome-profile"
  headless: false
  gemini_url: "https://gemini.google.com/app"
  # Auto-confirm the research plan generated by Deep Research
  auto_confirm_plan: true
  # Polling and timeout settings (in seconds)
  poll_interval_seconds: 10
  task_timeout_seconds: 1800
  # Stability checks: require N consecutive unchanged DOM snapshots + completion markers before marking completed
  stability_checks: 2

# Official Gemini API Backend Configuration (Priority 2: Optional fallback)
# NOTE: Gemini Web subscriptions (Google AI Pro/Ultra) do NOT include API quota.
# Enabling this uses pay-as-you-go billing on Google AI Studio.
api:
  enabled: false
  # Prefer setting via environment variable GEMINI_API_KEY instead of storing in plaintext
  api_key_env: "GEMINI_API_KEY"
  base_url: "https://generativelanguage.googleapis.com/v1beta"
  # Supported Deep Research agents:
  # - "deep-research-preview-04-2026" (Standard speed & efficiency)
  # - "deep-research-max-preview-04-2026" (Maximum comprehensiveness)
  deep_research_agent: "deep-research-preview-04-2026"
  # Optional managed agent for general tasks (distinct from Gemini App Tasks):
  # - "antigravity-preview-09-2026"
  app_task_fallback_agent: "antigravity-preview-09-2026"
  allow_api_fallback_for_app_task: false
  poll_interval_seconds: 10
  task_timeout_seconds: 3600

# Local HTTP Server (optional, strictly bound to 127.0.0.1)
http_server:
  host: "127.0.0.1"
  port: 8765
